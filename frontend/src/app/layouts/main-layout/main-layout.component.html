<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <div class="profile-section">
      <img src="https://via.placeholder.com/80" alt="Foto do Usuário" class="profile-pic">
      <h3 class="profile-name">Usuário</h3>
    </div>
    
    <mat-nav-list>
      <a mat-list-item routerLink="/lista">
        <mat-icon>list_alt</mat-icon>
        <span>Lista de Tarefas</span>
      </a>
      <a mat-list-item routerLink="/calendario">
        <mat-icon>calendar_today</mat-icon>
        <span>Calendário</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Planejador Pessoal</span>
    </mat-toolbar>
    
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
