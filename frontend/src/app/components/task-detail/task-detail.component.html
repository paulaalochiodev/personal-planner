<h2 mat-dialog-title>{{ tarefa.titulo }}</h2>

<mat-dialog-content>
  <p><strong>Descrição:</strong> {{ tarefa.descricao || 'Nenhuma descrição fornecida.' }}</p>
  <p><strong>Data:</strong> {{ formatarData(tarefa.data) }}</p>
  <p><strong>Status:</strong> {{ tarefa.concluida ? 'Concluída' : 'Pendente' }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Fechar</button>
</mat-dialog-actions>
