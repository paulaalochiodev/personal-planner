<h2 mat-dialog-title>
  {{ isEditMode ? 'Editar tarefa' : 'Adicionar nova tarefa'}}
</h2>

<mat-dialog-content>
  <form (ngSubmit)="onSubmit()" #taskForm="ngForm" class="task-form">

    <mat-form-field appearance="outline">
      <mat-label>Título</mat-label>
      <input matInput name="titulo" [(ngModel)]="newTask.titulo" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descrição</mat-label>
      <input matInput name="descricao" [(ngModel)]="newTask.descricao">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Data</mat-label>
      <input
        matInput
        [matDatepicker]="picker"
        [(ngModel)]="datePickerValue"
        name="datePickerValue"
        required
        placeholder="Selecione a data">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-slide-toggle [(ngModel)]="newTask.concluida" name="concluida">
      Marcar como concluída
    </mat-slide-toggle>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button
    mat-raised-button
    color="primary"
    [disabled]="!taskForm.form.valid"
    (click)="onSubmit()">
    {{ isEditMode ? 'Atualizar' : 'Salvar' }}
  </button>
</mat-dialog-actions>
